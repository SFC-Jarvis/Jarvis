[project]
name = "jarvis-tools"
version = "0.1.0"
description = "JARVIS のタスク・予定ツール（MCP サーバー + 画面用 HTTP API）。データは端末内の SQLite に保存する"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "fastmcp>=4.1.4",
    "pydantic>=2.14.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis_tools"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "S", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # 日本語の全角記号を許可

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "N802"]  # テスト名は日本語にするため

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=jarvis_tools --cov-report=term-missing --cov-fail-under=70"

[tool.uv]
package = true

[tool.coverage.run]
omit = ["*/__main__.py"]
